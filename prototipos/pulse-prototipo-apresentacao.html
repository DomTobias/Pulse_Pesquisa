input[type=radio], input[type=checkbox] { accent-color: var(--accent, rgb(var(--primary))); }
.accent-bg { background: var(--accent, rgb(var(--primary))); }
.accent-text { color: var(--accent, rgb(var(--primary))); }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 2.25rem; height: 2.25rem; border-radius: .5rem; color: rgb(var(--muted)); transition: background .15s, color .15s; }
.icon-btn:hover:not(:disabled) { background: rgb(var(--surface2)); color: rgb(var(--ink)); }
.icon-btn:disabled { opacity: .35; cursor: not-allowed; }
.icon-btn.sm { width: 1.75rem; height: 1.75rem; border-radius: .375rem; }
button:focus-visible, a:focus-visible, [role="switch"]:focus-visible, summary:focus-visible { outline: 2px solid rgb(var(--primary)); outline-offset: 2px; }
[data-tip] { position: relative; }
@media (hover: hover) {
  [data-tip]:hover::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); white-space: nowrap; background: rgb(var(--ink)); color: rgb(var(--surface)); font-size: 11px; font-weight: 500; padding: 4px 8px; border-radius: 6px; pointer-events: none; z-index: 80; animation: fade .12s ease .25s both; }
}
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.985) } to { opacity: 1; transform: none } }
.anim-fade { animation: fade .18s ease both; }
.anim-pop { animation: pop .18s ease both; }

.demo-chip { top: calc(env(safe-area-inset-top, 0px) + 12px); }

.drop-over { box-shadow: inset 0 2px 0 rgb(var(--primary)); }
.scroll-thin { scrollbar-width: thin; scrollbar-color: rgb(var(--line)) transparent; }
.scroll-thin::-webkit-scrollbar { width: 8px; height: 8px; }
.scroll-thin::-webkit-scrollbar-thumb { background: rgb(var(--line)); border-radius: 8px; }

function genResponses(forms) {
  const r = rng(20261110);
  const areas = DEFAULT_SETTINGS.areas, managers = DEFAULT_SETTINGS.managers;
  const areaBias = [0.5, 0.7, -1.1, -0.3, 0.1, -1.5, 0.6, 1.0, -0.5, 0.2, 1.1];
  const mgrBias = managers.map(() => (r() - 0.5) * 1.8);
  const topicBias = { 'Liderança': 0.3, 'Estrutura organizacional': -0.7, 'Benefícios': -1.5, 'Orgulho': 0.9, 'Reconhecimento': -0.3, 'Ambiente': 0, 'Comentários': 0 };
  const hc = AREA_HEADCOUNT, hcTotal = hc.reduce((a, b) => a + b, 0);
  const pickArea = () => { let x = r() * hcTotal; for (let i = 0; i < hc.length; i++) { x -= hc[i]; if (x <= 0) return i; } return 0; };
  const hourW = [0, 0, 0, 0, 0, 1, 2, 4, 7, 8, 7, 5, 4, 6, 8, 7, 5, 4, 3, 2, 2, 1, 1, 0]; const hT = hourW.reduce((a, b) => a + b, 0);
  const pickHour = () => { let x = r() * hT; for (let h = 0; h < 24; h++) { x -= hourW[h]; if (x <= 0) return h; } return 10; };
  const out = [];
  const make = (f, t, cycle, trend, i) => {
    const ai = pickArea(); const mi = ai + (ai + 11 < managers.length && r() < 0.5 ? 11 : 0);
    const d = new Date(t); d.setHours(pickHour(), Math.floor(r() * 60), 0, 0);
    if (d.getTime() > Date.now()) d.setTime(Date.now() - Math.floor(r() * 4 * 3600e3));
    const complete = r() > 0.07; const answers = {};
    f.sections.forEach((s, si) => s.questions.forEach(q => {
      if (!complete && si >= f.sections.length - 1) return;
      if (q.type === 'scale') { const noise = (r() + r() + r() - 1.5) * 2.4; const v = Math.round(6.9 + areaBias[ai] + mgrBias[mi] + (topicBias[s.title] || 0) + trend + noise); answers[q.id] = Math.max(q.min, Math.min(q.max, v)); }
      else if (q.type === 'long') { if (r() < 0.22) answers[q.id] = pick(r, OPEN_POOL[s.title] || OPEN_POOL['Comentários']); }
      else if (q.type === 'yesno') answers[q.id] = r() < 0.8 ? 'yes' : 'no';
    }));
    out.push({ id: `r_${f.id}_${i}`, formId: f.id, participant: 'Anônimo', area: areas[ai].id, manager: managers[mi].id, cycle, submittedAt: d.toISOString(), status: complete ? 'complete' : 'partial', answers });
  };
  forms.forEach(f => {
    if (f.id === 'f1') {
      let i = 0; cyclesOf(f).forEach(c => {
        const isCurrent = c.end > Date.now(); const elapsed = isCurrent ? Math.max(0.15, (Date.now() - c.start) / (c.end - c.start)) : 1;
        const n = Math.round((128 + r() * 40) * Math.min(1, elapsed * 1.35));
        for (let k = 0; k < n; k++) { const t = c.start + (Math.min(Date.now(), c.end) - c.start) * Math.pow(r(), 1.6); make(f, t, c.index, (c.index - 4) * 0.12, i++); }
      });
    }
    if (f.id === 'f2') { const s = new Date(f.startAt).getTime(), e = new Date(f.endAt).getTime(); for (let i = 0; i < 176; i++) make(f, s + (e - s) * r(), null, -0.4, i); }
  });
  return out.sort((a, b) => b.submittedAt.localeCompare(a.submittedAt));
}

const STORE_KEY = 'prismaforms:demo:v2';

function initialData() { const forms = mockForms(); return { forms, responses: genResponses(forms), settings: { ...DEFAULT_SETTINGS } }; }
function loadData() {
  try { const raw = lsGet(STORE_KEY); if (raw) { const d = JSON.parse(raw); if (d && Array.isArray(d.forms) && Array.isArray(d.responses)) return { ...d, settings: { ...DEFAULT_SETTINGS, ...(d.settings || {}) } }; } } catch (e) {}
  return initialData();
}
function reducer(state, a) {
  switch (a.type) {
    case 'form/upsert': {
      const exists = state.forms.some(f => f.id === a.form.id);

function validateQ(q, v) {
  if (q.type === 'info') return null;
  const empty = v === undefined || v === null || v === '' || (Array.isArray(v) && v.length === 0);
  if (empty) return q.required ? 'Esta pergunta é obrigatória.' : null;
  switch (q.type) {
    case 'email': return EMAIL_RE.test(String(v).trim()) ? null : 'Informe um e-mail válido, como nome@empresa.com.br.';
    case 'phone': { const d = String(v).replace(/\D/g, ''); return d.length >= 10 && d.length <= 11 ? null : 'Informe o telefone com DDD, como (11) 91234-5678.'; }
    case 'number': {
      const n = Number(String(v).replace(',', '.'));
      if (String(v).trim() === '' || isNaN(n)) return 'Informe apenas números.';
      if (q.min !== '' && q.min != null && n < Number(q.min)) return `O valor mínimo é ${q.min}.`;
      if (q.max !== '' && q.max != null && n > Number(q.max)) return `O valor máximo é ${q.max}.`;
      return null;
    }
    case 'date': { const d = new Date(`${v}T12:00`); return isNaN(d) || d.getFullYear() < 1900 || d.getFullYear() > 2100 ? 'Informe uma data válida.' : null; }
    default: return null;
  }
}
function formatAnswer(q, v) {
  if (v === undefined || v === null || v === '' || (Array.isArray(v) && !v.length)) return '—';
  const opt = id => ((q.options || []).find(o => o.id === id) || {}).label;
  switch (q.type) {
    case 'single': case 'dropdown': return opt(v) || '—';
    case 'multiple': return v.map(opt).filter(Boolean).join(', ') || '—';
    case 'yesno': return v === 'yes' ? 'Sim' : 'Não';
    case 'scale': return `${v} (escala de ${q.min} a ${q.max})`;
    case 'date': return fmtDate(`${v}T12:00`);
    default: return String(v);
  }

/* ============================== Formulários ============================== */
function useFormActions() {
  const { svc, toast, confirm, publicUrl, openBuilder, data } = useApp();
  const publish = f => {
    const qs = f.sections.flatMap(s => s.questions).filter(q => q.type !== 'info');
    if (!qs.length) { toast('Adicione pelo menos uma pergunta antes de publicar.', 'error'); return; }
    if (f.endAt && new Date(f.endAt) < new Date()) { toast('A data de encerramento já passou. Ajuste o período no construtor antes de publicar.', 'error'); return; }
    const res = effectiveStatus({ ...f, state: 'active', startAt: f.startAt || new Date().toISOString() });
    confirm({ title: 'Publicar formulário?', icon: 'send', confirmLabel: 'Publicar',
      message: html`<span>“${f.title}” ficará disponível no link público. ${f.startAt || f.endAt ? periodText(f) + '.' : 'Sem período definido: fica aberto até ser encerrado.'} ${res === 'scheduled' ? html`<${Fragment}><br/><br/>Como a data inicial ainda não chegou, o status será <b>Agendado</b>.<//>` : ''}</span>`,
      onConfirm: () => { svc.publish(f.id); toast(res === 'scheduled' ? 'Formulário agendado.' : 'Formulário publicado.'); } });
  };
  const unpublish = f => confirm({ title: 'Despublicar formulário?', icon: 'pause', confirmLabel: 'Despublicar', message: `“${f.title}” volta para rascunho e o link público deixa de aceitar respostas. As respostas já recebidas são mantidas.`, onConfirm: () => { svc.unpublish(f.id); toast('Formulário despublicado.'); } });
  const close = f => confirm({ title: 'Encerrar formulário?', icon: 'lock', confirmLabel: 'Encerrar', danger: true, message: `“${f.title}” deixa de aceitar respostas imediatamente. Você poderá consultar os resultados em Relatórios.`, onConfirm: () => { svc.close(f.id); toast('Formulário encerrado.'); } });
  const duplicate = f => { const c = svc.duplicate(f.id); toast(`Cópia criada: “${c.title}”.`); };
  const remove = f => confirm({ title: 'Excluir formulário?', confirmLabel: 'Excluir', danger: true, message: `“${f.title}” e as ${(data.responses.filter(r => r.formId === f.id).length)} respostas associadas serão removidos desta demonstração.`, onConfirm: () => { svc.remove(f.id); toast('Formulário excluído.'); } });
  const copyLink = async f => { const ok = await copyText(publicUrl(f)); toast(ok ? 'Link copiado.' : 'Não foi possível copiar. Selecione o link e copie manualmente.', ok ? 'success' : 'error'); };
  return { publish, unpublish, close, duplicate, remove, copyLink };
}
function formMenuItems(f, A, nav) {
  const status = effectiveStatus(f);
  return [
    { label: 'Editar', icon: 'edit', onClick: () => nav.openBuilder(f.id) },
    { label: 'Visualizar', icon: 'eye', onClick: () => nav.openPublic(f.id) },
    { label: 'Compartilhar', icon: 'globe', onClick: () => nav.openShare(f.id) },
    { label: 'Copiar link público', icon: 'link', onClick: () => A.copyLink(f) },
    { divider: true },
    f.state !== 'active' ? { label: 'Publicar', icon: 'send', onClick: () => A.publish(f) } : { label: 'Despublicar', icon: 'pause', onClick: () => A.unpublish(f) },
    { label: 'Encerrar', icon: 'lock', onClick: () => A.close(f), disabled: status === 'closed' || status === 'draft' },
    { label: 'Duplicar', icon: 'copy', onClick: () => A.duplicate(f) },

    { label: 'Excluir', icon: 'trash', danger: true, onClick: () => A.remove(f) },

}

/* ============================== Período / linha do tempo ============================== */
function PeriodTimeline({ form }) {
  if (!form.startAt || !form.endAt) return null;
  const s = new Date(form.startAt).getTime(), e = new Date(form.endAt).getTime(), n = Date.now();
  if (e <= s) return null;
  const lo = Math.min(s, n), hi = Math.max(e, n), span = hi - lo || 1;
  const p = t => `${((t - lo) / span) * 92 + 4}%`;
  return html`<div className="pt-2 pb-1">
    <div className="relative h-2 rounded-full bg-surface2">
      <div className="absolute top-0 h-2 rounded-full bg-primary/35" style=${{ left: p(s), width: `calc(${p(e)} - ${p(s)})` }}></div>
      <div className="absolute -top-1 h-4 w-0.5 rounded bg-ink" style=${{ left: p(n) }} title="Agora"></div>
    </div>
    <div className="relative h-5 text-[11px] text-muted mt-1">
      <span className="absolute -translate-x-1/2" style=${{ left: p(n) }}>agora</span>
    </div>
    <div className="flex justify-between text-[11px] text-muted"><span>Início ${fmtDate(form.startAt)}</span><span>Fim ${fmtDate(form.endAt)}</span></div>
  </div>`;
}

        <${Field} label="Descrição" hint="Aparece abaixo do título no formulário público."><textarea rows="2" className=${inputCls} value=${draft.description} onChange=${e => { const v = e.target.value; update(n => { n.description = v; }); }}></textarea><//>

          ${dateErr && html`<p className="text-xs text-danger flex items-center gap-1"><${Icon} name="alert" size=${13} />O encerramento precisa ser depois do início.</p>`}

            <div className="font-medium text-ink text-[13px]">${periodText(draft)}</div>
            <div className="text-muted mt-1">${isActive ? STATUS_EXPLAIN[status] : html`<${Fragment}>Ao publicar com essas datas, o status será <b className="text-ink">${STATUS[ifPublished].label}</b>.<//>`}</div>
            <${PeriodTimeline} form=${draft} />
          </div>
          ${(draft.startAt || draft.endAt) && html`<button type="button" className="text-xs font-medium text-muted hover:text-ink" onClick=${() => update(n => { n.startAt = null; n.endAt = null; })}>Limpar período</button>`}

          <select className=${inputCls} value=${draft.layout} onChange=${e => { const v = e.target.value; update(n => { n.layout = v; }); }}>

      <//>
      <${Card} className="p-5">
        <${PanelTitle}>Link público<//>
        <div className="flex items-stretch rounded-lg border border-line overflow-hidden text-sm focus-within:border-primary">

          <input className="flex-1 min-w-0 bg-surface px-2.5 py-2 outline-none text-ink" value=${draft.slug} onChange=${e => { const v = e.target.value.toLowerCase().replace(/[^a-z0-9-]/g, '-'); update(n => { n.slug = v; }); }} onBlur=${() => update(n => { n.slug = slugify(n.slug); })} aria-label="Endereço do link" />

        <button type="button" className="text-xs text-primary font-medium mt-2" onClick=${() => update(n => { n.slug = slugify(n.title); })}>Gerar a partir do título</button>
      <//>
    </div>`;
  } else if (kind === 'section') {

            <${Icon} name="chevronRight" size=${15} className="text-muted" />
          </li>`)}

      <//>

          <${Field} label="Fim"><select className=${inputCls} value=${q.max} onChange=${e => { const v = Number(e.target.value); updQ(q.id, x => { x.max = v; }); }}>${[3, 4, 5, 6, 7, 8, 9, 10].map(n => html`<option key=${n} value=${n}>${n}</option>`)}</select><//>
        <//>` : html`<${Fragment}>
          <${Field} label="Valor mínimo"><input className=${inputCls} inputMode="decimal" value=${q.min ?? ''} placeholder="Livre" onChange=${e => { const v = e.target.value.replace(/[^\d.-]/g, ''); updQ(q.id, x => { x.min = v; }); }} /><//>

          <div className="flex items-center gap-2"><span className="text-sm text-muted flex-1">${i + 1} de ${s.questions.length} neste tópico</span>
            <${Btn} size="sm" icon="arrowUp" disabled=${si === 0 && i === 0} onClick=${() => moveQuestion(q.id, -1)}><span className="sr-only">Subir</span><//>

      ${pager}
    <//>`}

    ${tab === 'base' && html`<${Card}>

        <tbody>${resps.slice(page * PER, page * PER + PER).map(r => { const sc = scoreOf([r], allScaleQs); return html`<tr key=${r.id} className="border-t border-line hover:bg-surface2/50">
          <td className="px-5 py-2.5 whitespace-nowrap tabular-nums">${fmtDate(r.submittedAt)} <span className="text-muted">${fmtTime(r.submittedAt)}</span></td>
          ${recurring && html`<td className="px-3 py-2.5 tabular-nums">${r.cycle ? `${r.cycle}º` : '—'}</td>`}
          ${seg && html`<${Fragment}><td className="px-3 py-2.5 max-w-[220px] truncate" title=${areaName(r.area)}>${areaName(r.area)}</td><td className="px-3 py-2.5">${mgrName(r.manager)}</td><//>`}
          <td className="px-3 py-2.5 text-right tabular-nums font-semibold" style=${{ color: sc.value != null ? zoneOf(sc.value, zones).color : undefined }}>${sc.value == null ? '—' : pct(sc.value)}</td>

          <td className="px-3 py-2.5 hidden sm:table-cell"><span className=${cx('inline-flex items-center rounded-full px-2 py-0.5 text-xs font-medium', r.status === 'complete' ? 'bg-ok/10 text-ok' : 'bg-warn/10 text-warn')}>${r.status === 'complete' ? 'Completa' : 'Parcial'}</span></td>
          <td className="px-3 py-2.5 text-right"><${Btn} size="sm" variant="ghost" icon="eye" onClick=${() => setDetail(r)}>Visualizar<//></td>
        </tr>`; })}</tbody>
      </table></div>`}
      ${pager}
    <//>`}
    <${ResponseDetail} response=${detail} form=${detail ? formById[detail.formId] : null} onClose=${() => setDetail(null)} />
  </div>`;
}

      <button type="button" className="icon-btn relative" aria-label="Notificações" aria-expanded=${nOpen} onClick=${() => { setNOpen(o => !o); setUnread(false); setPOpen(false); }}>
        <${Icon} name="bell" />${unread && html`<span className="absolute top-2 right-2 h-2 w-2 rounded-full bg-danger ring-2 ring-surface"></span>`}</button>
      ${nOpen && html`<div className="absolute right-0 mt-2 w-[min(340px,calc(100vw-1.5rem))] rounded-xl border border-line bg-surface shadow-xl z-50 anim-pop overflow-hidden">
        <div className="px-4 py-3 border-b border-line flex items-center justify-between"><span className="text-sm font-semibold">Notificações</span><span className="text-xs text-muted">Ilustrativas</span></div>
        <ul className="divide-y divide-line">${notifs.map((n, i) => html`<li key=${i}><button type="button" className="w-full flex gap-3 px-4 py-3 text-left hover:bg-surface2" onClick=${() => { setNOpen(false); go(n.to); }}>
          <span className="h-8 w-8 rounded-lg bg-primary/10 text-primary flex items-center justify-center shrink-0"><${Icon} name=${n.icon} size=${15} /></span>
          <span className="min-w-0"><span className="block text-sm text-ink leading-snug">${n.text}</span><span className="block text-xs text-muted mt-0.5">${n.time}</span></span></button></li>`)}</ul>
      </div>`}
    </div>
    <div className="relative" ref=${pRef}>
      <button type="button" className="flex items-center gap-2.5 rounded-lg pl-1 pr-2 py-1 hover:bg-surface2" aria-expanded=${pOpen} onClick=${() => { setPOpen(o => !o); setNOpen(false); }}>
        <${Avatar} name=${data.settings.managerName} size=${32} />
        <span className="hidden sm:block text-left leading-tight"><span className="block text-sm font-medium">${data.settings.managerName}</span><span className="block text-xs text-muted">${data.settings.managerRole}</span></span>
        <${Icon} name="chevronDown" size=${15} className="text-muted hidden sm:block" />
      </button>
      ${pOpen && html`<div className="absolute right-0 mt-2 w-60 rounded-xl border border-line bg-surface shadow-xl z-50 py-1.5 anim-pop">
        <div className="px-3 py-2 border-b border-line mb-1"><div className="text-sm font-medium truncate">${data.settings.managerName}</div><div className="text-xs text-muted truncate">${data.settings.managerEmail}</div></div>
        <button type="button" className="w-full flex items-center gap-2.5 px-3 py-2 text-sm hover:bg-surface2" onClick=${() => { setPOpen(false); go('configuracoes'); }}><${Icon} name="user" size=${16} className="text-muted" />Meu perfil</button>
        <button type="button" className="w-full flex items-center gap-2.5 px-3 py-2 text-sm hover:bg-surface2" onClick=${() => { setPOpen(false); go('configuracoes'); }}><${Icon} name="sliders" size=${16} className="text-muted" />Configurações</button>
        <div className="my-1 border-t border-line"></div>
        <button type="button" className="w-full flex items-center gap-2.5 px-3 py-2 text-sm hover:bg-surface2" onClick=${() => { setPOpen(false); toast('A saída da conta será implementada com a autenticação real.', 'info'); }}><${Icon} name="logout" size=${16} className="text-muted" />Sair</button>
      </div>`}
    </div>
  </header>`;
}
function AdminLayout({ route, children }) {
  const [mobile, setMobile] = useState(false);
  const mainRef = useRef(null);
  useEffect(() => { if (mainRef.current) mainRef.current.scrollTop = 0; setMobile(false); }, [route]);
  return html`<div className="h-full flex bg-bg text-ink">
    <aside className="hidden lg:flex w-64 shrink-0 flex-col border-r border-line bg-surface"><${Sidebar} route=${route} /></aside>
    ${mobile && html`<div className="lg:hidden fixed inset-0 z-50 flex modal-wrap">
      <div className="absolute inset-0 bg-black/40 anim-fade" onClick=${() => setMobile(false)}></div>
      <aside className="relative w-72 max-w-[85vw] h-full bg-surface border-r border-line anim-pop"><${Sidebar} route=${route} onNavigate=${() => setMobile(false)} /></aside>
    </div>`}
    <div className="flex-1 min-w-0 flex flex-col">
      <${Header} route=${route} onMenu=${() => setMobile(true)} />
      <main ref=${mainRef} className="flex-1 overflow-y-auto scroll-thin">
        <div className=${cx('mx-auto p-4 sm:p-6', route === 'construtor' ? 'max-w-[1500px]' : 'max-w-7xl lg:p-8')}>${children}</div>
      </main>
    </div>
  </div>`;
}

/* ============================== App ============================== */
const ROUTES = ['visao-geral', 'formularios', 'construtor', 'compartilhar', 'publico', 'relatorios', 'configuracoes'];
function readHash() { try { const h = (window.location.hash || '').replace('#', ''); return ROUTES.includes(h) ? h : 'visao-geral'; } catch (e) { return 'visao-geral'; } }
function App() {
  const [data, dispatch] = useReducer(reducer, null, loadData);
  const stateRef = useRef(data); stateRef.current = data;
  const [route, setRoute] = useState(readHash);
  const [currentId, setCurrentId] = useState(() => { const c = lsGet(CUR_KEY); return c && data.forms.some(f => f.id === c) ? c : (data.forms[0] && data.forms[0].id); });
  const [toasts, setToasts] = useState([]);
  const [confirmState, setConfirmState] = useState(null);
  const guardRef = useRef(false);

  useEffect(() => { const f = () => setRoute(readHash()); window.addEventListener('hashchange', f); return () => window.removeEventListener('hashchange', f); }, []);
  useEffect(() => { if (!lsSet(STORE_KEY, JSON.stringify(data))) { /* armazenamento indisponível: a demo segue só em memória */ } }, [data]);
  useEffect(() => { if (currentId) lsSet(CUR_KEY, currentId); }, [currentId]);
  useEffect(() => {
    const el = document.documentElement; const t = data.settings.theme;
    if (t === 'light' || t === 'dark') el.setAttribute('data-theme', t); else el.removeAttribute('data-theme');
    if (data.settings.primary) el.style.setProperty('--primary', hexToTriple(data.settings.primary)); else el.style.removeProperty('--primary');
  }, [data.settings.theme, data.settings.primary]);
  useEffect(() => { document.title = `${data.settings.platformName} · ${route === 'publico' ? 'Formulário' : ROUTE_TITLES[route] || ''}`; }, [route, data.settings.platformName]);

  const toast = useCallback((msg, kind = 'success') => { const id = uid('t'); setToasts(a => [...a.slice(-3), { id, msg, kind }]); setTimeout(() => setToasts(a => a.filter(t => t.id !== id)), 3600); }, []);
  const confirm = useCallback(opts => setConfirmState(opts), []);
  const svc = useMemo(() => makeService(dispatch, () => stateRef.current), []);
  const navigate = useCallback(n => { setRoute(n); try { if (window.location.hash !== '#' + n) window.location.hash = n; } catch (e) {} }, []);
  const go = useCallback(n => {
    if (guardRef.current && n !== 'construtor') {
      setConfirmState({ title: 'Sair sem salvar?', danger: true, confirmLabel: 'Descartar e sair', message: 'Há alterações não salvas no construtor. Se você sair agora, elas serão descartadas.', onConfirm: () => { guardRef.current = false; navigate(n); } });
    } else navigate(n);
  }, [navigate]);
  const counts = useMemo(() => { const c = {}; data.responses.forEach(r => { c[r.formId] = (c[r.formId] || 0) + 1; }); return c; }, [data.responses]);
  const publicUrl = useCallback(f => `${(data.settings.baseUrl || '').replace(/\/$/, '')}/formulario/${f.slug}`, [data.settings.baseUrl]);
  const openWith = (id, r) => { const doIt = () => { setCurrentId(id); navigate(r); }; if (guardRef.current && (r !== 'construtor' || id !== currentId)) setConfirmState({ title: 'Sair sem salvar?', danger: true, confirmLabel: 'Descartar e sair', message: 'Há alterações não salvas no construtor. Se você sair agora, elas serão descartadas.', onConfirm: () => { guardRef.current = false; doIt(); } }); else doIt(); };
  const ctx = {
    data, svc, route, go, toast, confirm, counts, publicUrl, currentId, guardRef, settings: data.settings,
    openBuilder: id => openWith(id, 'construtor'), openShare: id => openWith(id, 'compartilhar'), openPublic: id => openWith(id, 'publico'),
    createNew: () => { const proceed = () => { guardRef.current = false; const f = svc.createForm(stateRef.current.settings); setCurrentId(f.id); navigate('construtor'); toast('Formulário criado como rascunho.'); };
      if (guardRef.current) setConfirmState({ title: 'Sair sem salvar?', danger: true, confirmLabel: 'Descartar e criar', message: 'Há alterações não salvas no construtor. Criar um novo formulário vai descartá-las.', onConfirm: proceed }); else proceed(); },
  };
  const pages = { 'visao-geral': OverviewPage, formularios: FormsPage, construtor: BuilderPage, compartilhar: SharePage, relatorios: ReportsPage, configuracoes: SettingsPage };
  const Page = pages[route] || OverviewPage;
  return html`<${AppCtx.Provider} value=${ctx}>
    ${route === 'publico' ? html`<${PublicPage} />` : html`<${AdminLayout} route=${route}><${Page} key=${route === 'construtor' ? 'b' : route} /><//>`}
    <${Toasts} items=${toasts} />
    <${ConfirmModal} state=${confirmState} onClose=${() => setConfirmState(null)} />
  <//>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
